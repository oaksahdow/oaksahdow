<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Oakshadow - GitHub Stats</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Meu GitHub Stats</h1>
            <p>Visualização interativa dos meus repositórios</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Repositórios</h3>
                <div id="repo-count" class="stat-number">0</div>
            </div>
            <div class="stat-card">
                <h3>Seguidores</h3>
                <div id="follower-count" class="stat-number">0</div>
            </div>
            <div class="stat-card">
                <h3>Estrelas</h3>
                <div id="star-count" class="stat-number">0</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="languageChart"></canvas>
        </div>

        <div class="repos-list" id="repos-list">
            <!-- Lista de repositórios será inserida aqui -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
